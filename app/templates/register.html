<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStudy - Register</title>
</head>
<body>
    <h3>Register to MyStudy</h3>

    <form method="post">
      Full Name:
      <input type="text" name="name" placeholder="Enter your full name" required><br><br>

      Email Address:
      <input type="email" name="email" placeholder="Enter your email" required><br><br>

      Username:
      <input type="text" name="username" placeholder="Choose a username" required><br><br>

      Password:
      <input type="password" name="password" placeholder="Create a password" required><br><br>

      <button type="submit">Register</button>
    </form>

    <p>
      Already have an account?
      <a href="{{ url_for('main.login') }}">Login here</a>
    </p>
</body>
</html>
